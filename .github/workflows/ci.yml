name: Verify SomniSync

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Format
        run: cargo fmt --manifest-path server/Cargo.toml --check
      - name: Lint
        run: cargo clippy --manifest-path server/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path server/Cargo.toml --locked

  unity-package-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Check package and documentation files
        run: python3 tools/check_release_files.py
      - name: Install site dependencies
        working-directory: website
        run: npm ci
      - name: Typecheck site
        working-directory: website
        run: npm run typecheck
      - name: Build site
        working-directory: website
        run: npm run build

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build relay image
        run: docker build -f server/Dockerfile -t somnisync-relay:ci .
      - name: Start isolated relay
        run: |
          docker run -d --name somnisync-ci \
            -p 127.0.0.1:19090:9090 -p 127.0.0.1:19091:9091 \
            somnisync-relay:ci
      - name: Check HTTP and WebSocket behavior
        run: |
          python -m pip install 'websockets==14.2'
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19091/metrics > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:19091/metrics > /dev/null
          python server/benchmarks/check_state_replay.py --url ws://127.0.0.1:19090
      - name: Show relay logs on failure
        if: failure()
        run: docker logs somnisync-ci
      - name: Remove temporary relay
        if: always()
        run: docker rm -fv somnisync-ci || true
