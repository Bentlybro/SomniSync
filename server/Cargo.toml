[package]
name = "somnium-relay"
version = "2.2.0"
edition = "2021"
license = "MPL-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
rusqlite = { version = "0.31", features = ["bundled"] }
bytes = "1"
rapier3d = { version = "0.22", features = ["parallel", "simd-stable"] }
half = "2"

# Metrics dashboard
axum = "0.7"
serde = { version = "1", features = ["derive"] }
sysinfo = "0.32"

[profile.release]
opt-level = 3
lto = true
