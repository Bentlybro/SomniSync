[package]
name = "somnium-relay"
version = "2.2.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
rusqlite = { version = "0.31", features = ["bundled"] }
bytes = "1"
rapier3d = "0.22"
half = "2"

[profile.release]
opt-level = 3
lto = true
